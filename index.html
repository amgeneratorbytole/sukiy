<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwen 2.5 Coder — InstaBox AI</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0d1424;
      --panel-2: #111b30;
      --border: #1e2d4a;
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.14);
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --danger: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0d192e 0%, var(--bg) 65%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .config {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .config input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .config input:focus {
      border-color: var(--cyan);
    }

    #apiUrl {
      width: 280px;
    }

    #apiToken {
      width: 170px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 85%;
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--cyan-dim);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #ffffff;
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .msg.error {
      border-color: var(--danger);
      color: #ffb3c1;
    }

    .msg pre {
      background: #050810;
      border: 1px solid #1b2842;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      color: #7dd3fc;
    }

    footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
    }

    .input-wrap {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      resize: none;
      height: 52px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--cyan);
    }

    button {
      background: var(--cyan);
      color: #031018;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 0 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hint {
      max-width: 960px;
      margin: 6px auto 0;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <span>Test ai</span>
    </div>
  </header>

  <main id="chatBox">
    <div class="msg ai">Halo! Saya terhubung ke <strong>qwen2.5-coder:7b</strong> di InstaBox. Masukkan URL port 11434 di pojok kanan atas, lalu ketik pertanyaan coding Anda.</div>
  </main>

  <footer>
    <div class="input-wrap">
      <textarea id="promptInput" placeholder="Minta buatkan kode, debug error, atau jelaskan fungsi..."></textarea>
      <button id="sendBtn" onclick="kirimPesan()">Kirim</button>
    </div>
    <div class="hint">Tekan <strong>Enter</strong> untuk mengirim, <strong>Shift + Enter</strong> untuk baris baru.</div>
  </footer>

  <script>
    const MODEL_NAME = "qwen2.5-coder:7b";
    const chatBox = document.getElementById("chatBox");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const apiUrlInput = document.getElementById("apiUrl");
    const apiTokenInput = document.getElementById("apiToken");

    // Simpan riwayat percakapan agar AI ingat konteks chat sebelumnya
    const messages = [
      {
        role: "system",
        content: "Kamu adalah asisten AI pemrograman yang cerdas, ramah, dan menjawab dengan bahasa Indonesia yang jelas serta kode yang rapi."
      }
    ];

    function formatText(text) {
      // Ubah blok kode ```...``` menjadi <pre> sederhana
      const escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      return escaped.replace(/```[\w]*\n([\s\S]*?)```/g, "<pre>$1</pre>");
    }

    function tambahBubble(isi, tipe, isHtml = false) {
      const div = document.createElement("div");
      div.className = `msg ${tipe}`;
      if (isHtml) {
        div.innerHTML = isi;
      } else {
        div.textContent = isi;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function kirimPesan() {
      const prompt = promptInput.value.trim();
      const baseUrl = apiUrlInput.value.trim().replace(/\/$/, "");
      const token = apiTokenInput.value.trim();

      if (!prompt) return;
      if (!baseUrl || baseUrl.includes("URL-PORT-11434")) {
        tambahBubble("Harap masukkan URL HTTPS port 11434 InstaBox Anda terlebih dahulu di kolom atas.", "ai error");
        return;
      }

      tambahBubble(prompt, "user");
      promptInput.value = "";
      sendBtn.disabled = true;

      messages.push({ role: "user", content: prompt });
      const loadingBubble = tambahBubble("Sedang berpikir...", "ai");

      try {
        const headers = { "Content-Type": "application/json" };
        if (token) {
          headers["Authorization"] = `Bearer ${token}`;
        }

        const response = await fetch(`${baseUrl}/api/chat`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: messages,
            stream: false
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} — ${response.statusText}`);
        }

        const data = await response.json();
        const reply = data?.message?.content || "Tidak ada respons dari model.";

        messages.push({ role: "assistant", content: reply });
        loadingBubble.innerHTML = formatText(reply);
      } catch (err) {
        loadingBubble.classList.add("error");
        loadingBubble.textContent =
          `Gagal terhubung ke InstaBox: ${err.message}\n\n` +
          `Pastikan:\n` +
          `1. Port 11434 sudah di-publish di tab Ports InstaBox.\n` +
          `2. Ollama dijalankan dengan OLLAMA_HOST=0.0.0.0:11434 dan OLLAMA_ORIGINS="*".`;
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        kirimPesan();
      }
    });
  </script>
</body>
</html>
